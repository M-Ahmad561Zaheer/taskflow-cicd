<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Add New Task</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <a href="index.html">Dashboard</a>
        <a href="add-task.html" class="active" style="border-bottom: 2px solid #3498db; color: #3498db;">Add Task</a>
        <a href="task-list.html">Task List</a>
        <a href="task-detail.html">Task Detail</a>
        <a href="about.html">About</a>
    </nav>

    <main class="container">
        <section class="form-section">
            <h2>➕ Add A New Task</h2>
            <p>Fill out the details below to create a new assignment or project task.</p>
            
            <form id="taskForm" class="task-form">
                
                <div class="form-group">
                    <label for="task-title">Task Title:</label>
                    <input type="text" id="task-title" name="title" placeholder="Enter task title..." required>
                </div>

                <div class="form-group">
                    <label for="task-desc">Description:</label>
                    <textarea id="task-desc" name="description" rows="4" placeholder="Enter task details/description..." required></textarea>
                </div>

                <div class="form-group">
                    <label for="due-date">Due Date:</label>
                    <input type="date" id="due-date" name="dueDate" required>
                </div>

                <div class="form-group">
                    <label for="priority">Priority Level:</label>
                    <select id="priority" name="priority" required>
                        <option value="" disabled selected>Select priority...</option>
                        <option value="High">🔴 High Priority</option>
                        <option value="Medium">🟡 Medium Priority</option>
                        <option value="Low">🟢 Low Priority</option>
                    </select>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-submit">Save Task</button>
                    <button type="reset" class="btn btn-reset">Clear Form</button>
                </div>

            </form>
        </section>
    </main>

    <footer style="text-align: center; padding: 20px; background-color: #2c3e50; color: white; margin-top: 60px;">
        <p>&copy; 2026 TaskFlow App. All rights reserved.</p>
    </footer>

    <script>
        document.getElementById('taskForm').addEventListener('submit', function(e) {
            e.preventDefault(); // Fixes HTTP 405 Error
            
            const title = document.getElementById('task-title').value;
            alert(`🎉 Success! Task "${title}" saved successfully.\nRedirecting you to the Task List...`);
            window.location.href = "task-list.html";
        });
    </script>
</body>
</html>
