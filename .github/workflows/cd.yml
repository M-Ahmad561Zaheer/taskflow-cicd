name: TaskFlow CD Pipeline

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deployment Confirmation
        run: |
          echo "Code successfully pushed to develop branch."
          echo "Vercel integration is automatically handling the live deployment!"